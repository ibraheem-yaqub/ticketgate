    <circle cx="256" cy="256" r="240" fill="url(#tgH)"/>
    <g fill="none" stroke="#6e1418" stroke-opacity=".28" stroke-width="3">
      <circle cx="256" cy="256" r="220"/><circle cx="256" cy="256" r="196"/><circle cx="256" cy="256" r="172"/><circle cx="256" cy="256" r="148"/>
    </g>
  </g>
  <path d="M78 214 A182 182 0 0 1 214 78" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="24" stroke-linecap="round"/>
  <path d="M112 176 A150 150 0 0 1 150 122" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="124" fill="#0b0a0a"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#161313" stroke-width="4"/>
  <g class="tg-gate">
