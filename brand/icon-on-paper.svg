<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>TickGate</title>
<rect width="512" height="512" rx="112" fill="#f3f0ec"/>
<g transform="translate(46 46) scale(.8203)">
<defs>
  <radialGradient id="tgG" gradientUnits="userSpaceOnUse" cx="164" cy="143" r="400">
    <stop offset="0" stop-color="#f8c9c4"/><stop offset=".18" stop-color="#f2a19c"/>
    <stop offset=".45" stop-color="#e86a66"/><stop offset=".75" stop-color="#c43a3a"/>
    <stop offset="1" stop-color="#8f1d22"/>
  </radialGradient>
  <filter id="tgM" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="w"/>
