      <rect x="252" y="238" width="22" height="40" fill="#f2a19c"/>
      <rect x="292" y="238" width="22" height="40" fill="#f2a19c"/>
    </g>
    <circle cx="206" cy="258" r="25" fill="#f3f0ec"/>
    <circle cx="206" cy="258" r="9" fill="#e86a66"/>
