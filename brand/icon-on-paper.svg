    <feColorMatrix in="b" type="matrix" values="0 0 0 0 .70  0 0 0 0 .14  0 0 0 0 .17  .85 0 0 0 0" result="v"/>
    <feComposite in="v" in2="SourceAlpha" operator="in" result="vi"/>
    <feMerge><feMergeNode in="w"/><feMergeNode in="vi"/></feMerge>
  </filter>
  <clipPath id="tgC"><circle cx="256" cy="256" r="240"/></clipPath>
  <radialGradient id="tgH" cx="30%" cy="26%" r="34%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
  <circle cx="256" cy="256" r="250" fill="#6e1418"/>
  <g clip-path="url(#tgC)">
